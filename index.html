<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JST – Visitor Access Control</title>

<style>

body{
margin:0;
min-height:100vh;
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;

background:
linear-gradient(rgba(10,42,67,0.88), rgba(10,42,67,0.88)),
url("https://images.unsplash.com/photo-1518770660439-4636190af475");

background-size:cover;
background-position:center;
background-attachment:fixed;
}

.container{
padding:20px;
}

header{
text-align:center;
padding:25px 10px;
}

.logo{
font-size:46px;
font-weight:900;
letter-spacing:5px;
}

.logo .j{color:#000;}
.logo .s{color:#0a2a43;}
.logo .t{color:#000;}

.logo-sub{
color:#e0e0e0;
font-size:14px;
margin-top:5px;
}

header p{
color:white;
margin-top:10px;
}

.card{
background:rgba(255,255,255,0.93);
padding:20px;
margin-bottom:20px;
border-radius:16px;
box-shadow:0 12px 28px rgba(0,0,0,0.3);
}

input,
select,
button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
}

button{
background:#0a2a43;
color:white;
border:none;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

button:hover{
background:#06304d;
}

.success{
color:green;
margin-top:10px;
font-weight:bold;
}

.error{
color:red;
margin-top:10px;
font-weight:bold;
}

.code-box{
margin-top:15px;
padding:15px;
background:#0a2a43;
color:white;
border-radius:12px;
text-align:center;
font-size:22px;
font-weight:bold;
letter-spacing:3px;
}

footer{
text-align:center;
padding:10px;
font-size:12px;
background:rgba(255,255,255,0.7);
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.04);}
100%{transform:scale(1);}
}

</style>

</head>

<body>

<header>

<div class="logo">

<span class="j">J</span>
<span class="s">S</span>
<span class="t">T</span>

</div>

<div class="logo-sub">
Jackson’s Smart Technologies
</div>

<p>
Visitor Access Control System
</p>

</header>

<!-- LOGIN -->
<div class="container" id="auth">

<div class="card">

<h2>Resident Login</h2>

<input
id="username"
placeholder="Complex Username"
>

<input
id="password"
type="password"
placeholder="Strong Password"
>

<button onclick="login()">
Login
</button>

<hr style="margin:20px 0;">

<h3>Create Resident Account</h3>

<input
id="newUsername"
placeholder="Create Complex Username"
>

<input
id="newHouse"
placeholder="House Number"
>

<input
id="newPassword"
type="password"
placeholder="Create Strong Password"
>

<button onclick="createAccount()">
Create Account
</button>

<div id="authMsg"></div>

</div>

</div>

<!-- APP -->
<div
class="container"
id="app"
style="display:none;"
>

<button onclick="logout()">
Logout
</button>

<!-- GENERATE ACCESS -->
<div class="card">

<h2>
Resident – Generate Visitor Access
</h2>

<input
id="residentName"
placeholder="Resident Name"
>

<input
id="houseNumber"
placeholder="House Number"
>

<input
id="visitorName"
placeholder="Visitor Name"
>

<select id="hours">

<option value="1">1 Hour</option>
<option value="2">2 Hours</option>
<option value="4">4 Hours</option>
<option value="8">8 Hours</option>
<option value="24">24 Hours</option>

</select>

<button onclick="generateCode()">
Generate Access Code
</button>

<div id="generatedResult"></div>

</div>

<!-- PANIC BUTTON -->
<div class="card">

<h2 style="color:red;">
🚨 Emergency Panic Button
</h2>

<button
onclick="triggerPanic()"
style="
background:#b30000;
font-size:22px;
padding:20px;
animation:pulse 1s infinite;
">
🚨 ACTIVATE PANIC
</button>

<div
id="panicStatus"
style="margin-top:15px;"
></div>

<!-- LIVE MAP -->
<div
id="mapBox"
style="margin-top:15px;display:none;"
>

<iframe
id="mapFrame"
width="100%"
height="300"
style="border:0;border-radius:12px;"
loading="lazy"
allowfullscreen>
</iframe>

</div>

</div>

</div>

<footer>

THIS SYSTEM REMAINS THE PROPERTY OF
JACKSON SMART TECHNOLOGIES (PTY) LTD |
REG 2026/320361/07

</footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyBD_sK8xF3m2t_s_b8ihzLx8XHs-M1MGGI",

authDomain: "jackson-smart-technologi-1db26.firebaseapp.com",

projectId: "jackson-smart-technologi-1db26",

storageBucket: "jackson-smart-technologi-1db26.firebasestorage.app",

messagingSenderId: "400637493049",

appId: "1:400637493049:web:8d349168400988493672e8"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

/* ================= CREATE ACCOUNT ================= */

window.createAccount = async function(){

const username =
document.getElementById("newUsername").value.trim();

const house =
document.getElementById("newHouse").value.trim();

const password =
document.getElementById("newPassword").value.trim();

if(
username.length < 6 ||
password.length < 8 ||
!house
){

document.getElementById("authMsg").innerHTML =
"<p class='error'>Use strong details</p>";

return;

}

try{

const q = query(
collection(db,"residentAccounts"),
where("username","==",username)
);

const snap = await getDocs(q);

if(!snap.empty){

document.getElementById("authMsg").innerHTML =
"<p class='error'>Username already exists</p>";

return;

}

await addDoc(
collection(db,"residentAccounts"),
{
username,
house,
password,
created:Date.now()
}
);

document.getElementById("authMsg").innerHTML =
"<p class='success'>Account Created ✔</p>";

}catch(e){

document.getElementById("authMsg").innerHTML =
"<p class='error'>"+e.message+"</p>";

}

};

/* ================= LOGIN ================= */

window.login = async function(){

const u =
document.getElementById("username").value.trim();

const p =
document.getElementById("password").value.trim();

/* DEFAULT ADMIN */

if(
u === "glenaccess"
&&
p === "weneverdie"
){

document.getElementById("auth").style.display =
"none";

document.getElementById("app").style.display =
"block";

return;

}

/* CHECK CREATED ACCOUNTS */

const q = query(
collection(db,"residentAccounts"),
where("username","==",u),
where("password","==",p)
);

const snap = await getDocs(q);

if(!snap.empty){

document.getElementById("auth").style.display =
"none";

document.getElementById("app").style.display =
"block";

}else{

document.getElementById("authMsg").innerHTML =
"<p class='error'>Invalid Login</p>";

}

};

/* ================= LOGOUT ================= */

window.logout = function(){

location.reload();

};

/* ================= PANIC SYSTEM ================= */

window.triggerPanic = async function(){

document.getElementById("panicStatus").innerHTML =
"<p class='error'>🚨 PANIC ACTIVATED</p>";

navigator.geolocation.getCurrentPosition(

async(position)=>{

const lat = position.coords.latitude;
const lng = position.coords.longitude;

/* SHOW LIVE MAP */

document.getElementById("mapBox").style.display =
"block";

document.getElementById("mapFrame").src =

"https://maps.google.com/maps?q="
+
lat
+
","
+
lng
+
"&z=16&output=embed";

/* SAVE TO FIREBASE */

await addDoc(
collection(db,"panicAlerts"),
{
latitude:lat,
longitude:lng,
time:Date.now(),
status:"ACTIVE"
}
);

},

()=>{

alert("Location access denied");

}

);

};

/* ================= GENERATE CODE ================= */

window.generateCode = async function(){

let resident =
document.getElementById("residentName").value;

let house =
document.getElementById("houseNumber").value;

let visitor =
document.getElementById("visitorName").value;

let hours =
document.getElementById("hours").value;

if(
!resident
||
!house
||
!visitor
){

alert("Fill all fields");

return;

}

/* RANDOM 6 DIGIT CODE */

let code = Math.floor(
100000 + Math.random()*900000
);

let expiry =
Date.now() + hours * 3600000;

try{

await addDoc(
collection(db,"visitorCodes"),
{

resident,

houseNumber: house,

visitor,

code: String(code),

expiry,

created: Date.now()

}
);

/* SUCCESS */

document.getElementById("generatedResult")
.innerHTML =

`

<p class="success">
Visitor Access Created Successfully ✔
</p>

<div class="code-box">

${code}

</div>

<p style="margin-top:10px;">
House Number:
<b>${house}</b>
</p>

`;

}catch(e){

document.getElementById("generatedResult")
.innerHTML =

"<p class='error'>Firebase Error: "
+
e.message
+
"</p>";

}

};

</script>

</body>
</html>
