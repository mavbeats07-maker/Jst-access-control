<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JST Resident Control</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#0a2a43;
color:white;
}

.container{padding:20px;}

.card{
background:white;
color:black;
padding:15px;
margin-bottom:15px;
border-radius:12px;
}

input,button{
width:100%;
padding:10px;
margin-top:8px;
}

button{
background:#0a2a43;
color:white;
border:none;
cursor:pointer;
}

.panicBtn{
background:red;
font-weight:bold;
font-size:18px;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.05)}
100%{transform:scale(1)}
}

.hidden{display:none;}

#map{
width:100%;
height:250px;
display:none;
margin-top:10px;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- PANIC -->
<div class="card">
<h2 style="color:red;">🚨 EMERGENCY PANIC</h2>

<button class="panicBtn" onclick="panic()">
ACTIVATE PANIC
</button>

<div id="panicMsg"></div>
<iframe id="map"></iframe>
</div>

<!-- LOGIN -->
<div class="card">
<h3>Login</h3>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<div id="loginMsg"></div>
</div>

<!-- TOGGLE CREATE ACCOUNT -->
<div class="card">
<h3 onclick="toggleCreate()" style="cursor:pointer;">
➕ Create Account (Click)
</h3>

<div id="createBox" class="hidden">
<input id="newUser" placeholder="Username">
<input id="newHouse" placeholder="House Number">
<input id="newPass" type="password" placeholder="Password">
<button onclick="createAccount()">Create</button>
<div id="accMsg"></div>
</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_PROJECT"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* TOGGLE ACCOUNT */
window.toggleCreate = function(){
document.getElementById("createBox").classList.toggle("hidden");
};

/* CREATE ACCOUNT */
window.createAccount = async function(){

await addDoc(collection(db,"residentAccounts"),{
username:newUser.value,
house:newHouse.value,
password:newPass.value,
created:Date.now()
});

accMsg.innerHTML="Account Created ✔";
};

/* LOGIN */
window.login = async function(){

const q=query(
collection(db,"residentAccounts"),
where("username","==",user.value),
where("password","==",pass.value)
);

const snap=await getDocs(q);

if(snap.empty){
loginMsg.innerHTML="Invalid Login";
return;
}

loginMsg.innerHTML="Logged in ✔";
};

/* PANIC (REAL TIME) */
window.panic = function(){

navigator.geolocation.getCurrentPosition(async(pos)=>{

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;

await addDoc(collection(db,"panicAlerts"),{
lat,
lng,
time:Date.now(),
status:"ACTIVE"
});

panicMsg.innerHTML="🚨 ALERT SENT";

map.style.display="block";
map.src=`https://maps.google.com/maps?q=${lat},${lng}&z=18&output=embed`;

});
};

</script>

</body>
</html>
